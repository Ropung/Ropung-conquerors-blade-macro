name: Windows tests and build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q main.py core automation ui tests
      - run: python -m unittest discover -s tests -v
      - name: GUI smoke test without game inputs
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke_gui.py
      - name: Build standalone EXE
        run: |
          python package_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --add-data "build/bundled_assets/calibration;calibration" --name ConquerorsBladeMacro main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ConquerorsBladeMacro-Windows
          path: dist/ConquerorsBladeMacro.exe
          if-no-files-found: error
