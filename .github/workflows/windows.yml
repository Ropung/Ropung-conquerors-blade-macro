name: Windows tests and build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q main.py core automation ui tests
      - run: python -m unittest discover -s tests -v
      - name: GUI smoke test without game inputs
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke_gui.py
      - name: Build standalone EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ConquerorsBladeMacro main.py
          Copy-Item config.example.json,README.md,PLAN.txt dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ConquerorsBladeMacro-Windows
          path: dist/
